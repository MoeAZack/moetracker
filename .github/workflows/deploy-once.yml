name: Deploy MoeTracker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: moetracker-production
  cancel-in-progress: false

env:
  PROJECT_ID: moetracker-raad
  SERVICE_NAME: moetracker
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_MOETRACKER_RAAD || secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy frontend to Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting:moetracker --project "$PROJECT_ID" --non-interactive

      - name: Deploy backend to Cloud Run
        run: >-
          gcloud run deploy "$SERVICE_NAME"
          --source .
          --project "$PROJECT_ID"
          --region "$REGION"
          --quiet
